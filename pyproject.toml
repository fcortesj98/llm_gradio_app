[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gradio-llm-app"
version = "0.1.0"
description = "Gradio demos and watsonx.ai-backed chat and RAG apps"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gradio==4.44.0",
    "ibm-watsonx-ai==1.1.2",
    "langchain==0.2.11",
    "langchain-community==0.2.10",
    "langchain-ibm==0.1.11",
    "pypdf==4.3.1",
    "chromadb==0.4.24",
    "python-dotenv==1.2.3",
]

[project.scripts]
gradio-llm-app = "gradio_llm_app.cli:main"

[tool.setuptools.packages.find]
include = ["gradio_llm_app*"]

[tool.ruff]
line-length = 100
target-version = "py310"
